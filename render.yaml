services:
  - type: web
    name: creovanta-nexus-2026
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: APP_URL
        value: https://creovanta-nexus-2026.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REQUIRE_PAID_ACCESS
        value: "true"
      - key: FIREWALL_RATE_LIMIT
        value: "120"
      - key: FIREWALL_AUTH_RATE_LIMIT
        value: "10"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: PREFERRED_URL_SCHEME
        value: https
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
